name: Publish NPM Package

on:
  release:
    types: [created]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: |
          npm ci
          npm publish
